name: spideliprovider
description: A new Flutter project.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+15

environment:
  sdk: ^3.13.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  # Held on 4.x: 5.0 moves to material_ui, whose showModalBottomSheet needs material_ui MaterialLocalizations that this flutter/material app does not provide (picker would fail to open).
  bottom_picker: ^4.2.0
  cached_network_image: ^4.0.0
  cloud_functions: ^6.3.3
  country_code_picker: ^3.4.1
  cupertino_icons: ^1.0.9
  datetime_picker_formfield_new: ^2.1.0
  dotted_border: ^3.1.0
  firebase_database: ^12.4.4
  firebase_auth: ^6.5.4
  firebase_core: ^4.11.0
  cloud_firestore: ^6.6.0
  firebase_messaging: ^16.4.1
  firebase_storage: ^13.4.3
  firebase_app_check: ^0.4.5
  googleapis_auth: ^2.3.2

  flutter_easyloading: ^4.0.2
  flutter_local_notifications: ^22.0.1
  flutter_otp_text_field: ^1.5.1+1
  flutter_rating_bar: ^4.0.1
  flutter_svg: ^2.3.0
  flutter_widget_from_html: ^0.17.2
  geocoding: ^5.0.0
  geolocator: ^14.0.3
  get: ^4.7.3
  image_picker: ^1.2.3
  intl: ^0.20.3
  intl_phone_number_input: ^0.7.5
  location: ^10.0.2
  mailer: ^7.1.0
  map_launcher: ^6.0.0
  path_provider: ^2.1.6
  photo_view: ^0.15.0
  # Held on 9.x: 10.0 requires a material_ui app; on flutter/material it ignores the app ThemeData and renders OTP cells with default colors.
  pin_code_fields: ^9.4.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  the_apple_sign_in: ^1.1.1
  url_launcher: ^6.3.2
  video_compress: ^3.1.4
  google_maps_flutter: ^2.17.1

  flutter_stripe: ^14.0.0
  razorpay_flutter: ^1.4.5
  flutter_paypal: ^0.2.1
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  flutter_google_places_hoc081098: ^2.0.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  syncfusion_flutter_pdf: ^34.2.8
  share_plus: ^13.3.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  # flutter_google_places_hoc081098 2.0.0 pins google_api_headers ^4 (package_info_plus ^8), which conflicts with
  # package_info_plus 10.x used by the rest of the tree. Its only call, `const GoogleApiHeaders().getHeaders()`, is unchanged in 5.x.
  # 5.4.1 needs Dart >=3.13.4 (Flutter 3.47.5); Flutter 3.47.4 ships Dart 3.13.3.
  google_api_headers: 5.4.0



#  web: 1.0.0
# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: Metropolis-Regular
      fonts:
        - weight: 500
        - asset: assets/fonts/Metropolis-Regular.otf

    - family: Metropolis-Medium
      fonts:
        - asset: assets/fonts/Metropolis-Medium.otf

    - family: Metropolis-Bold
      fonts:
        - weight: 700
        - asset: assets/fonts/Metropolis-Bold.otf

    - family: Metropolis-SemiBold
      fonts:
        - asset: assets/fonts/Metropolis-SemiBold.otf

    - family: Metropolis-ExtraBold
      fonts:
        - asset: assets/fonts/Metropolis-ExtraBold.otf
