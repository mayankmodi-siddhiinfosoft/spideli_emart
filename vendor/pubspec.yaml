name: vendor
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 6.0.0+5

environment:
  sdk: ^3.13.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_database: ^12.6.0
  firebase_storage: ^13.6.0
  firebase_messaging: ^16.7.0
  firebase_app_check: ^0.4.8
  crypto: ^3.0.7

  country_code_picker: ^3.4.1

  dotted_border: ^3.1.0
  geocoding: ^5.0.0
  googleapis_auth: ^2.0.0

  cached_network_image: ^4.0.0
  flutter_easyloading: ^4.0.2
  flutter_email_sender: ^10.0.1
  flutter_html: ^3.0.0
  flutter_local_notifications: ^22.3.1
  flutter_svg: ^2.2.4
  shimmer: ^4.0.0
  geolocator: ^14.0.3
  location: ^10.0.2
  get: ^4.7.3
#  google_sign_in: ^6.2.2
  google_sign_in: ^7.2.0
  image_picker: ^1.2.1
  intl: ^0.20.2
  pin_code_fields: ^10.0.0

  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.4
  sign_in_with_apple: ^8.2.0
  syncfusion_flutter_datepicker: ^34.2.8
  timer_count_down: ^2.2.2
  url_launcher: ^6.3.2
  uuid: ^4.5.3
  date_picker_timeline: ^1.2.7
  flutter_rating_bar: ^4.0.1
  datetime_picker_formfield_new: ^2.1.0
  flutter_polyline_points: ^3.1.0
  map_launcher: ^6.0.0
  story_view: ^0.16.6
  bottom_picker: ^5.0.0
  multi_select_flutter: ^4.1.3
  in_app_review: ^2.0.11
  share_plus: ^13.3.0
  photo_view: ^0.15.0
  path_provider: ^2.1.5
  video_compress: ^3.1.4
  mime: ^2.0.0
  mailer: ^7.1.0
  dropdown_search: ^7.0.0
  flutter_multi_formatter: ^2.13.10
  audioplayers: ^6.6.0

  flutter_map: ^8.2.2
  latlong2: ^0.10.1

  video_player: ^2.11.0
  google_maps_flutter: ^2.15.0
  google_maps_place_picker_mb: ^3.1.2

  esc_pos_utils: ^1.1.0
  # Held at 1.1.x: 1.2.x requires image ^4 but esc_pos_utils 1.1.0 (receipt generator) is locked to image ^3.
  print_bluetooth_thermal: ^1.1.7
  syncfusion_flutter_pdf: ^34.2.8

  #payment dependency
  flutter_stripe: ^14.0.0
  razorpay_flutter: ^1.4.1
  flutter_paypal: ^0.2.1

  file_picker: ^13.1.0

  image_gallery_saver_plus: ^5.1.1
  permission_handler: ^13.0.2

  rxdart: ^0.28.0
  http: ^1.6.0
  webview_flutter: ^4.14.1

dependency_overrides:
  # google_maps_place_picker_mb 3.1.2 (latest) pins geolocator ^10; it only calls isLocationServiceEnabled,
  # check/requestPermission, getCurrentPosition(desiredAccuracy:) and distanceBetween, all still present in 14.x.
  geolocator: ^14.0.3
  # google_maps_place_picker_mb 3.1.2 pins google_api_headers ^2 / package_info_plus ^4; it only calls
  # GoogleApiHeaders().getHeaders() (unchanged in 5.x) and never uses package_info_plus directly.
  # 5.4.1 needs Dart >=3.13.4 (Flutter 3.47.5); Flutter 3.47.4 ships Dart 3.13.3.
  google_api_headers: 5.4.0
  package_info_plus: ^10.2.1
  # flutter_paypal 0.2.1 (latest) pins webview_flutter_android ^3; 4.x only raised Android minSdk to 21, and the
  # AndroidWebViewController.enableDebugging / setMediaPlaybackRequiresUserGesture APIs it uses are unchanged.
  webview_flutter_android: ^4.14.1
  # esc_pos_utils 1.1.0 (latest) -> image ^3 -> xml ^6, which blocks syncfusion_flutter_pdf 34 (xml ^7). image 3.3.0
  # only uses basic XmlDocument.parse/children/attribute APIs (BitmapFont), which are unchanged in xml 7.
  xml: ^7.0.1
  # flutter_html 3.0.0 (latest) imports html's private src/query_selector.dart top-level `matches()`, which
  # html 0.15.7 removed (compile error). Pin to 0.15.6, the version the app already used before this upgrade.
  html: 0.15.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: EssentialSans
      fonts:
        - asset: assets/fonts/essential_sans_Regular.otf
          weight: 600
        - asset: assets/fonts/essential_sans_medium.otf
          weight: 500
        - asset: assets/fonts/essential_sans_semi_bold.otf
          weight: 600
        - asset: assets/fonts/essential_sans_bold.otf
          weight: 700
